name: C/C++ CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: master
    paths-ignore: &shared_paths
    - '**/*.md'
  pull_request:
    branches: master
    paths-ignore: *shared_paths

env:
  CFLAGS: -Werror

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        cc: [gcc, clang]
        # arm + clang is redundant — gcc-on-arm covers ARM-specific
        # issues and clang-on-x86 covers clang-specific ones.
        exclude:
          - os: ubuntu-24.04-arm
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y meson ninja-build ${{ matrix.cc }}

    - name: Setup
      # docker-test=true is safe to pass: ubuntu-latest and ubuntu-24.04-arm
      # both ship docker pre-installed and the runner user is in the docker
      # group, so test_docker_telnet actually runs (rather than skipping
      # itself via the exit-77 path it would take on a machine without docker).
      run: meson setup builddir -Db_sanitize=address,undefined -Db_lundef=false -Ddocker-test=true

    - name: Build (and pre-warm docker image in parallel)
      # Kick off the busybox-telnetd image build in the background so
      # ninja runs concurrently — when meson test reaches
      # test_docker_telnet, its own `docker build --load -q` is a cache
      # hit (~1s) instead of the cold pull-and-install (~30s) we'd
      # otherwise pay. `wait` surfaces the docker build's exit code so
      # a Dockerfile regression fails this step rather than the test.
      run: |
        docker build --load -q -t m2k-telnetd-test docker > /tmp/docker-build.log 2>&1 &
        docker_pid=$!
        ninja -v -C builddir
        wait $docker_pid || { echo '--- docker build log ---'; cat /tmp/docker-build.log; exit 1; }

    - name: Test
      run: meson test -C builddir --print-errorlogs

  musl:
    # Alpine, i.e. musl instead of glibc. The BSD jobs already cover
    # "not glibc", but they cover it on a different OS, so a glibc-only
    # call reads there as a BSD quirk. This job is Linux, so a failure
    # here means exactly one thing: something reached for a glibc
    # extension. -D_GNU_SOURCE is set project-wide (meson.build), and
    # musl accepts that macro while providing far less behind it, which
    # is what makes the mistake easy to make and invisible elsewhere.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # The build runs in `docker run` rather than a job-level
    # `container:` because the runner injects its own glibc-built node
    # for JavaScript actions, which cannot execute under musl —
    # actions/checkout would fail before any of this got a chance.
    #
    # python3 is not optional here despite tests/meson.build treating it
    # as such: without it those tests are never registered and the job
    # goes green having run fewer tests than it looks like.
    #
    # No sanitizers, unlike the linux job — Alpine's libasan does not
    # link (undefined __sanitizer::struct_sock_fprog_sz).
    #
    # -Dwerror=true rather than the workflow's CFLAGS: meson's own
    # option is recorded in the build config and scoped to this
    # project's targets. The other jobs still use CFLAGS; moving them
    # over is a separate change.
    - name: Build and test under musl
      run: |
        docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -c '
            set -e
            apk add --no-cache build-base meson ninja flex pkgconf python3
            meson setup builddir -Dwerror=true
            ninja -v -C builddir
            meson test -C builddir --print-errorlogs
          '

  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install meson

    - name: Setup
      run: meson setup builddir

    - name: Build
      run: ninja -v -C builddir

    - name: Test
      run: meson test -C builddir --print-errorlogs
